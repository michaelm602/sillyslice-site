<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />

    <title>Silly Slice | 3D Printed Fidget &amp; Sensory Toys</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Silly Slice makes 3D-printed fidget and sensory toys for busy hands and loud brains. Shop ready-to-ship toys or request custom colors. Handmade with love."
    />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Silly Slice" />
    <meta property="og:title"       content="Silly Slice | 3D Printed Fidget &amp; Sensory Toys" />
    <meta property="og:description" content="Handmade 3D-printed fidget and sensory toys. Ready-to-ship or made-to-order with custom colors. Perfect for kids with ADHD and sensory needs." />
    <meta property="og:image"       content="https://michaelm602.github.io/sillyslice-site/hero/printer.jpg" />
    <meta property="og:url"         content="https://michaelm602.github.io/sillyslice-site/" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Silly Slice | 3D Printed Fidget &amp; Sensory Toys" />
    <meta name="twitter:description" content="Handmade 3D-printed fidget and sensory toys. Ready-to-ship or made-to-order with custom colors." />
    <meta name="twitter:image"       content="https://michaelm602.github.io/sillyslice-site/hero/printer.jpg" />

    <!-- 🔥 FIRST-PAINT DARK THEME (prevents dark flicker) -->
    <style>
      :root {
        --bg: #070b14;
        --text: rgba(255,255,255,0.92);
        --panel: rgba(255,255,255,0.06);
        --border: rgba(255,255,255,0.14);
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      /* match your cards so they don't "pop" later */
      .card,
      .card-soft {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
      }
    </style>
    <!-- 🔥 END FIRST-PAINT FIX -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
